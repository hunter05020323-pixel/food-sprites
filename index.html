<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF4D6">
<title>美食小精靈</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4D6; --dot:#F6E3AE; --card:#FFFFFF; --text:#2B2118; --muted:#76664F;
  --ink:#2B2118; --sun:#FFD23F; --sky:#8ED1FC; --tomato:#FF5A3C; --note:#FFF9C4;
  --font:'Huninn','Zen Maru Gothic','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E2136; --dot:#2A2E4B; --card:#2D3252; --text:#FFF4D6; --muted:#C2BBD3; --ink:#0D0E1A;
  }
}
:root[data-theme="dark"]{
  --bg:#1E2136; --dot:#2A2E4B; --card:#2D3252; --text:#FFF4D6; --muted:#C2BBD3; --ink:#0D0E1A;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  font-family:var(--font); font-weight:400; line-height:1.5; color:var(--text);
  background:radial-gradient(circle, var(--dot) 1.6px, transparent 1.9px) 0 0/16px 16px, var(--bg);
}
h1,h2,h3{font-weight:400; margin:0}
button,input{font:inherit; color:inherit}
a{color:inherit}
.wrap{max-width:720px; margin:0 auto; padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.screen[hidden]{display:none !important}
.center{min-height:calc(100dvh - 120px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--sun); color:#2B2118; text-decoration:none; cursor:pointer;
  border:3px solid var(--ink); border-radius:999px; box-shadow:4px 4px 0 var(--ink);
  padding:12px 20px; font-size:17px; transition:transform .08s, box-shadow .08s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.tile:focus-visible{outline:3px dashed var(--tomato); outline-offset:3px}
.btn.big{font-size:20px; padding:16px 28px}
.btn.small{font-size:14px; padding:6px 12px; border-width:2.5px; box-shadow:2px 2px 0 var(--ink)}
.btn.small:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink)}
.btn.blue{background:var(--sky)}
.btn.plain{background:var(--card); color:var(--text)}

/* ---------- sprites ---------- */
.sprite{display:block; overflow:visible}
.sprite .sp-food{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.sprite.anim .sp-body{transform-box:fill-box; transform-origin:50% 100%; animation:sp-hop 2.4s ease-in-out infinite; animation-delay:var(--d,0s)}
.sprite.anim .sp-stem{transform-box:fill-box; transform-origin:50% 100%; animation:sp-sway 3.2s ease-in-out infinite; animation-delay:var(--d,0s)}
@keyframes sp-hop{
  0%,100%{transform:translateY(0) scale(1,1)}
  40%{transform:translateY(-5px) scale(.97,1.04)}
  60%{transform:translateY(0) scale(1.05,.95)}
  75%{transform:translateY(0) scale(1,1)}
}
@keyframes sp-sway{0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(7deg)}}
.loading-sprites .sprite.anim .sp-body{animation-duration:.9s}
.loading-sprites .sprite:nth-child(2) .sp-body{animation-delay:-.3s}
.loading-sprites .sprite:nth-child(3) .sp-body{animation-delay:-.6s}
@media (prefers-reduced-motion: reduce){
  .sprite.anim .sp-body,.sprite.anim .sp-stem{animation:none}
}

/* ---------- home ---------- */
.home{gap:14px; padding-top:12px}
.hero-sprites{display:flex; align-items:flex-end; justify-content:center; gap:4px; min-height:110px}
.logo{
  font-size:clamp(44px,13vw,68px); line-height:1.1; letter-spacing:.04em; color:var(--sun);
  -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:4px 5px 0 var(--ink);
  transform:rotate(-2deg);
}
.tagline{margin:0; font-size:17px; color:var(--muted)}
.or{display:flex; align-items:center; gap:10px; width:100%; max-width:360px; color:var(--muted)}
.or::before,.or::after{content:""; flex:1; border-top:3px dotted var(--muted)}
.place-form{display:flex; gap:8px; width:100%; max-width:420px}
.place-form input{
  flex:1; min-width:0; padding:12px 16px; font-size:16px; background:var(--card);
  border:3px solid var(--ink); border-radius:999px; box-shadow:inset 2px 2px 0 rgba(0,0,0,.08);
}
.place-form input:focus{outline:3px dashed var(--tomato); outline-offset:2px}
.place-form .btn{padding:10px 18px}

/* ---------- loading / error ---------- */
.loading-sprites{display:flex; gap:10px; align-items:flex-end}
.loading-msg{margin:0; font-size:19px}
.err-actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}

/* ---------- speech bubble ---------- */
.bubble{
  position:relative; background:var(--card); color:var(--text);
  border:3px solid var(--ink); border-radius:18px; box-shadow:3px 3px 0 var(--ink); padding:10px 14px;
}
.bubble::before,.bubble::after{content:""; position:absolute; border-style:solid}
.bubble.left::before{left:-17px; bottom:14px; border-width:9px 16px 9px 0; border-color:transparent var(--ink) transparent transparent}
.bubble.left::after{left:-11px; bottom:16px; border-width:7px 12px 7px 0; border-color:transparent var(--card) transparent transparent}
.bubble.up::before{top:-17px; left:50%; margin-left:-9px; border-width:0 9px 16px 9px; border-color:transparent transparent var(--ink) transparent}
.bubble.up::after{top:-11px; left:50%; margin-left:-7px; border-width:0 7px 12px 7px; border-color:transparent transparent var(--card) transparent}
.bubble-title{font-size:18px}
.bubble-title .count{display:inline-block; margin-left:6px; font-size:13px; padding:0 8px; border-radius:999px; background:var(--tomato); color:#fff; border:2px solid var(--ink); vertical-align:2px}
.bubble-line{color:var(--muted); font-size:15px}

/* ---------- results ---------- */
.resbar{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px;
  margin:-16px -16px 0; padding:10px 16px;
  background:var(--bg); background:color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); border-bottom:3px solid var(--ink);
}
.where{flex:1; min-width:0; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.where .place{font-size:17px}
.notice{
  display:flex; gap:8px; align-items:flex-start; margin:14px 0 0; padding:10px 12px;
  background:var(--note); color:#2B2118; border:3px dashed var(--ink); border-radius:14px; font-size:14px;
}
.notice mark{background:linear-gradient(transparent 55%, #FFD23F 55%); color:inherit}
.notice-x{flex:none; border:0; background:none; cursor:pointer; font-size:16px; padding:0 4px; color:#2B2118}
.section-title{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:18px 0 10px; font-size:21px}
.section-title .sub{font-size:14px; color:var(--muted)}

.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:12px}
.tile{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:0;
  padding:8px 4px 8px; cursor:pointer; background:var(--card); color:var(--text);
  border:3px solid var(--ink); border-radius:18px; box-shadow:3px 3px 0 var(--ink);
  transition:transform .12s, box-shadow .12s; -webkit-tap-highlight-color:transparent;
}
.tile:nth-child(odd){transform:rotate(-1.2deg)}
.tile:nth-child(even){transform:rotate(1.2deg)}
.tile[aria-pressed="true"]{background:var(--soft); color:#2B2118; transform:translate(-2px,-3px) rotate(0); box-shadow:5px 6px 0 var(--ink)}
.tile-name{font-size:14px; line-height:1.3}
.tile-who{font-size:11px; color:var(--muted)}
.tile[aria-pressed="true"] .tile-who{color:#5B4E3C}
.tile-count{
  position:absolute; top:-10px; right:-8px; min-width:28px; padding:0 6px; font-size:13px; line-height:24px;
  background:var(--tomato); color:#fff; border:2.5px solid var(--ink); border-radius:999px;
}

.panel{scroll-margin-top:64px}
.panel-head{display:flex; align-items:flex-end; gap:14px; margin:26px 0 14px}
.panel-head .bubble{flex:1; margin-bottom:22px}
.list{display:grid; gap:14px}
.card{
  display:flex; gap:12px; padding:12px; background:var(--card);
  border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink);
}
.card-sprite{
  flex:none; width:56px; align-self:flex-start; display:flex; justify-content:center; padding:4px 0 2px;
  background:var(--soft); border:2.5px solid var(--ink); border-radius:14px;
}
.card-body{flex:1; min-width:0}
.card-name{font-size:18px; line-height:1.35; overflow-wrap:anywhere}
.card-meta{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin-top:4px; font-size:13px; color:var(--muted)}
.tag{background:var(--c); color:#2B2118; border:2px solid var(--ink); border-radius:999px; padding:0 8px; font-size:12px}
.card-hours{margin-top:4px; font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.card-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.more{display:flex; justify-content:center; margin-top:18px}
.empty{display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; margin-top:36px}

.foot{margin-top:28px; text-align:center; font-size:12px; color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <section id="home" class="screen center home">
    <div class="hero-sprites" id="heroSprites"></div>
    <h1 class="logo">美食小精靈</h1>
    <p class="tagline">頭上長出美食的小精靈們，<br>帶你找附近 500 公尺內的好吃的！</p>
    <button id="gpsBtn" class="btn big" type="button">📍 用我現在的位置找</button>
    <div class="or">或</div>
    <form id="placeForm" class="place-form">
      <input id="placeInput" type="search" placeholder="輸入地點，例如：台北車站" enterkeyhint="search" autocomplete="off" aria-label="輸入地點">
      <button class="btn" type="submit">搜尋</button>
    </form>
  </section>

  <section id="loading" class="screen center" hidden>
    <div class="loading-sprites" id="loadingSprites"></div>
    <p class="loading-msg" id="loadingMsg">小精靈出發探險中…</p>
  </section>

  <section id="error" class="screen center" hidden>
    <div id="errorSprite"></div>
    <div class="bubble up"><div id="errorMsg"></div></div>
    <div class="err-actions">
      <button id="retryBtn" class="btn" type="button">🔄 再試一次</button>
      <button id="errHomeBtn" class="btn plain" type="button">⌨️ 改用輸入地點</button>
    </div>
  </section>

  <section id="results" class="screen" hidden>
    <div class="resbar">
      <div class="where">📍 <span class="place" id="whereLabel"></span> 附近 <span id="radiusLabel"></span></div>
      <button id="againBtn" class="btn small" type="button" aria-label="重新定位搜尋">🔄 重新找</button>
      <button id="homeBtn" class="btn small plain" type="button" aria-label="回首頁">🏠</button>
    </div>

    <div class="notice" id="notice">
      <span>💡</span>
      <div>這版<mark>沒有</mark>依 Google 評分篩選（那需要綁信用卡的 Google 付費服務）。店家依距離由近到遠排，按「⭐ Google 評分」就能直接看評價。</div>
      <button class="notice-x" id="noticeX" type="button" aria-label="關閉提示">✕</button>
    </div>

    <div id="found">
      <h2 class="section-title">選一隻小精靈 <span class="sub" id="summary"></span></h2>
      <div class="tiles" id="tiles"></div>
      <div class="panel" id="panel">
        <div class="panel-head">
          <div id="panelSprite"></div>
          <div class="bubble left">
            <div class="bubble-title" id="panelTitle"></div>
            <div class="bubble-line" id="panelLine"></div>
          </div>
        </div>
        <div class="list" id="list"></div>
        <div class="more"><button id="moreBtn" class="btn plain" type="button" hidden></button></div>
      </div>
    </div>

    <div class="empty" id="empty" hidden>
      <div id="emptySprite"></div>
      <div class="bubble up"><div id="emptyMsg"></div></div>
      <div class="err-actions">
        <button id="widenBtn" class="btn" type="button">🔍 擴大到 1 公里找找</button>
        <button id="emptyHomeBtn" class="btn plain" type="button">🏠 換個地點</button>
      </div>
    </div>
  </section>

  <footer class="foot">
    店家資料 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 貢獻者・地點搜尋 Photon<br>
    料理種類是依店名自動判斷的，偶爾會猜錯 🙏
  </footer>
</div>

<script>

function classify(t) {
  const text = [t.name, t['name:zh'], t['name:en'], t.brand, t['brand:en']].filter(Boolean).join(' ');
  if (t['diet:vegan'] === 'only' || t['diet:vegetarian'] === 'only' || NAME_RULES[0][1].test(text)) return 'vegetarian';
  for (const raw of (t.cuisine || '').toLowerCase().split(/[;,]/)) {
    const key = CUISINE_MAP[raw.trim().replace(/\s+/g, '_')];
    if (key) return key;
  }
  for (const [key, re] of NAME_RULES) if (re.test(text)) return key;
  if (t.amenity === 'cafe' || t.amenity === 'ice_cream') return 'cafe';
  return 'other';
}

// ---------- 畫小精靈（SVG） ----------
function mix(hex, to, t) {
  const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);
  const ch = (x, y) => Math.round(x + (y - x) * t);
  const r = ch(a >> 16, b >> 16), g = ch((a >> 8) & 255, (b >> 8) & 255), bl = ch(a & 255, b & 255);
  return '#' + [r, g, bl].map(v => v.toString(16).padStart(2, '0')).join('');
}

  const big = x => `<ellipse cx="${x}" cy="65.5" rx="5.4" ry="6.8" fill="${INK}"/><circle cx="${x + 1.9}" cy="62.6" r="2.2" fill="#fff"/><circle cx="${x - 1.8}" cy="68.4" r="1" fill="#fff"/>`;
  const arc = x => `<path d="M${x - 5} 67.5Q${x} 60.5 ${x + 5} 67.5" fill="none" stroke="${INK}" stroke-width="3.2" stroke-linecap="round"/>`;
  const shut = x => `<path d="M${x - 5} 65Q${x} 70 ${x + 5} 65" fill="none" stroke="${INK}" stroke-width="3.2" stroke-linecap="round"/>`;

// ---------- 定位與資料 ----------
async function fetchWithTimeout(url, opts = {}, ms = 25000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, {...opts, signal: ctrl.signal}); }
  finally { clearTimeout(timer); }
}

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!('geolocation' in navigator)) return reject({code: 'unsupported'});
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat: p.coords.latitude, lng: p.coords.longitude}),
      e => reject({code: e.code}),
      {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000}
    );
  });
}

async function geocode(q) {
  // 偏向台灣的結果
  const url = 'https://photon.komoot.io/api/?' + new URLSearchParams({q, limit: '1', lat: '23.7', lon: '121', lang: 'default'});
  const res = await fetchWithTimeout(url, {}, 15000);
  if (!res.ok) throw new Error('geocode ' + res.status);
  const f = (await res.json()).features?.[0];
  if (!f) return null;
  const [lng, lat] = f.geometry.coordinates;
  return {lat, lng, label: f.properties.name || q};
}

async function reverseArea({lat, lng}) {
  const res = await fetchWithTimeout(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lng}&limit=1&lang=default`, {}, 10000);
  if (!res.ok) return '';
  const p = (await res.json()).features?.[0]?.properties || {};
  return p.district || p.locality || p.city || '';
}

async function fetchPlaces({lat, lng}, radius) {
  const q = `[out:json][timeout:25];nwr["amenity"~"^(restaurant|fast_food|cafe|food_court|ice_cream)$"](around:${radius},${lat},${lng});out center tags;`;
  let lastErr;
  for (const url of OVERPASS) {
    try {
      const res = await fetchWithTimeout(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'data=' + encodeURIComponent(q),
      }, 30000);
      if (!res.ok) throw new Error('overpass ' + res.status);
      return (await res.json()).elements || [];
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function distance(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function buildAddr(t) {
  if (t['addr:full']) return t['addr:full'];
  return [t['addr:city'], t['addr:district'], t['addr:street'], t['addr:housenumber']].filter(Boolean).join('');
}

function toPlaces(elements, here, radius) {
  const list = [];
  for (const el of elements) {
    const t = el.tags || {};
    const name = t.name || t['name:zh'] || t['name:zh-Hant'] || t['name:en'] || t.brand;
    if (!name || CLOSED_RE.test(name)) continue;
    const lat = el.lat ?? el.center?.lat, lng = el.lon ?? el.center?.lon;
    if (lat == null || lng == null) continue;
    const dist = distance(here, {lat, lng});
    if (dist > radius + 50) continue;
    list.push({name, lat, lng, dist, cat: classify(t), hours: t.opening_hours || '', addr: buildAddr(t)});
  }
  list.sort((a, b) => a.dist - b.dist);
  // 同名又離很近的視為同一間
  const out = [];
  for (const p of list) if (!out.some(q => q.name === p.name && distance(p, q) < 60)) out.push(p);
  return out;
}

const DAY = {Mo:'一', Tu:'二', We:'三', Th:'四', Fr:'五', Sa:'六', Su:'日'};
function fmtHours(h) {
  h = h.trim();
  if (h === '24/7') return '24 小時營業';
  return h.replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su)\b/g, m => DAY[m])
    .replace(/[一二三四五六日](?:\s*[-,]\s*[一二三四五六日])*/g, m => '週' + m.replace(/\s*-\s*/g, '至').replace(/\s*,\s*/g, '、'))
    .replace(/\bPH\b/g, '國定假日')
    .replace(/\b(off|closed)\b/gi, '休息')
    .replace(/\s*;\s*/g, '；')
    .replace(/\s*,\s*/g, '、');
}
const fmtDist = d => d < 1000 ? `${Math.max(10, Math.round(d / 10) * 10)} 公尺` : `${(d / 1000).toFixed(1)} 公里`;
const fmtRadius = r => r >= 1000 ? `${r / 1000} 公里` : `${r} 公尺`;

function errorHTML(e) {
  const code = e && e.code;
  if (code === 1) return window.isSecureContext
    ? '定位權限被拒絕了 🙈<br>請到瀏覽器設定允許這個網頁使用「位置」，<br>或改用輸入地點。'
    : '這個網頁要用 https:// 開啟才能定位喔。<br>可以先改用輸入地點。';
  if (code === 2) return '抓不到你的位置…<br>請確認手機的定位（GPS）有打開，或改用輸入地點。';
  if (code === 3) return '定位花太久了，再試一次看看？';
  if (code === 'unsupported') return '這個瀏覽器不支援定位，請改用輸入地點。';
  if (code === 'notfound') return `找不到「${esc(e.q)}」這個地點，<br>換個說法試試？（例如加上縣市）`;
  return '餐廳資料伺服器現在有點忙，<br>等一下再試一次吧！';

    here, radius, district,
    label: label || district || '你的位置',
    places: toPlaces(elements, here, radius),

    + `<div class="card-body">`
    + `<h3 class="card-name">${esc(p.name)}</h3>`
    + `<div class="card-meta"><span class="tag">${c.name}</span><span>📍 ${fmtDist(p.dist)}・走路約 ${walkMin(p.dist)} 分鐘</span></div>`
    + (p.hours ? `<div class="card-hours">🕒 ${esc(fmtHours(p.hours))}</div>` : '')
    + `<div class="card-actions">`
    + `<a class="btn small" href="${esc(gSearchUrl(p))}" target="_blank" rel="noopener">⭐ Google 評分</a>`
    + `<a class="btn small blue" href="${esc(gDirUrl(p))}" target="_blank" rel="noopener">🧭 帶我去</a>`
    + `</div></div></article>`;
}

function renderPanel() {
  const sel = state.selected;
  const cat = sel === 'all' ? GUIDE : CAT[sel];
  const items = sel === 'all' ? state.places : state.places.filter(p => p.cat === sel);

  $('#panelSprite').innerHTML = spriteSVG(cat, {size: 84, anim: true});
  $('#panelTitle').innerHTML = `${esc(cat.who)}・${esc(sel === 'all' ? '全部美食' : cat.name)}<span class="count">${items.length} 間</span>`;
  $('#panelLine').textContent = sel === 'all'
    ? '由近到遠排好囉！點上面的小精靈可以只看那種料理～'
    : cat.line;

  $('#list').innerHTML = items.slice(0, state.shown).map(cardHTML).join('');
  const left = items.length - state.shown;
  const more = $('#moreBtn');
  more.hidden = left <= 0;
  if (left > 0) more.textContent = `再看 ${Math.min(PAGE, left)} 間（還有 ${left} 間）`;
}

// ---------- 事件 ----------
$('#gpsBtn').addEventListener('click', () => run(async () => search(await getPosition())));

$('#placeForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const q = $('#placeInput').value.trim();
  if (!q) { $('#placeInput').focus(); return; }
  run(async () => {
    const r = await geocode(q);
    if (!r) throw {code: 'notfound', q};
    await search(r, r.label);
  }, `正在找「${q}」在哪裡…`);
});

$('#tiles').addEventListener('click', ev => {
  const tile = ev.target.closest('.tile');
  if (!tile) return;
  const key = tile.dataset.key;
  state.selected = state.selected === key && key !== 'all' ? 'all' : key;
  state.shown = PAGE;
  for (const t of document.querySelectorAll('.tile')) t.setAttribute('aria-pressed', String(t.dataset.key === state.selected));
  renderPanel();
  $('#panel').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
});

$('#moreBtn').addEventListener('click', () => { state.shown += PAGE; renderPanel(); });
$('#noticeX').addEventListener('click', () => { $('#notice').hidden = true; storageSet('foodSprites.noticeClosed', '1'); });
$('#againBtn').addEventListener('click', () => lastAction && run(lastAction));
$('#retryBtn').addEventListener('click', () => lastAction && run(lastAction));
const goHome = () => { show('home'); $('#placeInput').focus(); };
$('#homeBtn').addEventListener('click', () => show('home'));
$('#errHomeBtn').addEventListener('click', goHome);
$('#emptyHomeBtn').addEventListener('click', goHome);
$('#widenBtn').addEventListener('click', () => {
  const {here, label} = state;
  run(() => search(here, label, 1000));
});

// ---------- 開場 ----------
$('#heroSprites').innerHTML = ['noodle', 'japanese', null, 'cafe', 'hotpot']
  .map(k => k ? spriteSVG(CAT[k], {size: 54, anim: true}) : spriteSVG(GUIDE, {size: 84, anim: true})).join('');
document.querySelector('link[rel="icon"]').href = 'data:image/svg+xml,' + encodeURIComponent(
  spriteSVG(GUIDE, {size: 64}).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '));

// 網址帶 ?lat=..&lng=.. 時直接用那個位置搜尋（方便收藏或測試）
const params = new URLSearchParams(location.search);
const pLat = parseFloat(params.get('lat')), pLng = parseFloat(params.get('lng'));
if (Number.isFinite(pLat) && Number.isFinite(pLng)) run(() => search({lat: pLat, lng: pLng}));
})();
</script>
</body>
</html>
